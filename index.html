<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#315ee8"><link rel="manifest" href="/manifest.webmanifest">
<title>BrightSteps Class 3</title>
<style>
:root{--ink:#17233d;--muted:#64718a;--blue:#315ee8;--sky:#edf3ff;--paper:#f6f8fc;--line:#e5eaf3;--green:#138a61;--orange:#ffb44d}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Nunito,"Trebuchet MS",system-ui,sans-serif}button,select{font:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid #91adff;outline-offset:2px}.app{max-width:760px;margin:auto;min-height:100dvh;padding-bottom:92px}.top{background:linear-gradient(130deg,#244ed4,#5689ff);color:white;padding:22px 18px 24px;border-radius:0 0 28px 28px}.topline{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-size:14px;font-weight:900;letter-spacing:.4px}.pill{border:1px solid #ffffff65;background:#ffffff20;color:white;border-radius:999px;padding:8px 12px;font-weight:800}.hello{margin-top:20px;font-size:28px;font-weight:900;line-height:1.15}.sub{opacity:.9;margin-top:7px;font-size:14px}.goal{margin-top:19px;background:#ffffff1d;border:1px solid #ffffff30;border-radius:17px;padding:13px}.goalrow{display:flex;justify-content:space-between;font-size:12px;font-weight:800}.track{height:7px;background:#ffffff45;border-radius:20px;margin-top:9px;overflow:hidden}.track span{display:block;height:100%;background:#ffda7b;border-radius:20px;width:0;transition:width .3s}.main{padding:18px}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 0 12px}.sectionhead h2{font-size:18px;margin:0}.muted{color:var(--muted);font-size:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:22px}.stat,.card{background:white;border:1px solid var(--line);border-radius:18px;padding:14px}.stat strong{font-size:22px;display:block}.stat span{font-size:11px;color:var(--muted)}.subjects{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.subject{background:white;border:1px solid var(--line);border-radius:18px;padding:14px;text-align:left;color:var(--ink);min-height:125px;transition:transform .15s,border .15s}.subject:active{transform:scale(.98)}.emoji{font-size:25px}.subject b{display:block;margin:8px 0 3px}.subject small{color:var(--muted)}.subject .mini{height:5px;border-radius:9px;background:#edf0f6;margin-top:12px;overflow:hidden}.mini span{display:block;height:100%;background:var(--blue)}.panel{background:white;border:1px solid var(--line);border-radius:20px;padding:17px;margin-bottom:14px}.btn{border:0;border-radius:13px;background:var(--blue);color:white;padding:12px 15px;font-weight:900}.btn.secondary{background:var(--sky);color:var(--blue)}.btn.ghost{background:#f1f4f9;color:#42516b}.btn.full{width:100%}.row{display:flex;gap:9px;flex-wrap:wrap}.lesson-title{font-size:23px;font-weight:900;line-height:1.2;margin:5px 0 10px}.tag{display:inline-block;background:#edf3ff;color:#315ee8;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:900}.explain{font-size:15px;line-height:1.7;color:#33415b}.example{background:#f3f7ff;border-left:4px solid #4778f2;padding:12px;border-radius:10px;margin:12px 0;line-height:1.55}.options{display:grid;gap:9px;margin:15px 0}.option{background:white;border:1.5px solid var(--line);border-radius:13px;padding:12px;text-align:left;color:var(--ink);font-weight:700}.option.selected{border-color:var(--blue);background:#edf3ff}.option.correct{border-color:#1a9b6c;background:#eafaf3}.option.wrong{border-color:#d95757;background:#fff0f0}.feedback{border-radius:12px;padding:12px;margin:12px 0;font-size:14px;line-height:1.5}.good{background:#e8f8f0;color:#126a4a}.bad{background:#fff0ed;color:#9a3930}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(760px,100%);display:grid;grid-template-columns:repeat(4,1fr);padding:9px 10px calc(9px + env(safe-area-inset-bottom));background:#ffffffef;backdrop-filter:blur(12px);border-top:1px solid var(--line);z-index:5}.nav button{border:0;background:transparent;color:#7a8599;padding:7px 2px;font-size:11px;font-weight:800;border-radius:12px}.nav button.active{background:var(--sky);color:var(--blue)}.nav .ni{display:block;font-size:19px;margin-bottom:3px}.hidden{display:none!important}.empty{text-align:center;padding:28px 12px;color:var(--muted)}.smalltitle{font-size:12px;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.7px}.barline{height:8px;border-radius:10px;background:#edf0f6;overflow:hidden;margin:8px 0 15px}.barline span{display:block;height:100%;background:var(--green)}@media(min-width:600px){.subjects{grid-template-columns:repeat(3,minmax(0,1fr))}.main{padding:22px}.top{padding:26px 24px}}
</style></head>
<body><div class="app">
<header class="top"><div class="topline"><div class="brand">✦ BRIGHTSTEPS <span style="opacity:.7">/ CLASS 3</span></div><button class="pill" id="langBtn">हिन्दी</button></div>
<div class="hello" id="greeting">Ready to shine, Rajat? 🌟</div><div class="sub" id="subline">Little steps today. Big discoveries tomorrow.</div>
<div class="goal"><div class="goalrow"><span id="goalLabel">Today's learning goal</span><span id="goalCount">0 / 5 questions</span></div><div class="track"><span id="goalBar"></span></div></div></header>
<main class="main" id="screen"></main>
<nav class="nav"><button data-tab="home" class="active"><span class="ni">⌂</span>Home</button><button data-tab="learn"><span class="ni">📚</span>Learn</button><button data-tab="practice"><span class="ni">✏️</span>Practice</button><button data-tab="progress"><span class="ni">🏆</span>Progress</button></nav>
</div>
<script>
const subjects=[
{id:'math',en:'Maths',hi:'गणित',icon:'🧮',color:'#5578ef',desc:'Think, solve, discover',lessons:[
{title:'Place value & big numbers',hi:'स्थानीय मान और बड़ी संख्याएँ',teach:'Every digit has a value based on its place. In 4,582, 4 means 4 thousands, 5 means 5 hundreds, 8 means 8 tens and 2 means 2 ones.',teachHi:'हर अंक का मान उसकी जगह पर निर्भर करता है। 4,582 में 4 हजार, 5 सैकड़ा, 8 दहाई और 2 इकाई को दर्शाते हैं।',example:'4,582 = 4,000 + 500 + 80 + 2',qs:[['What is the value of 7 in 3,742?','700','70','7','7,000',0,'The 7 is in the hundreds place, so its value is 700.'],['Which is the greatest number?','6,089','6,809','6,098','6,890',3,'Compare thousands, then hundreds, tens and ones.'] ]},
{title:'Multiplication challenge',hi:'गुणा चुनौती',teach:'Multiplication is equal groups. For 24 × 6, split 24 into 20 and 4: 20 × 6 = 120 and 4 × 6 = 24. Add them to get 144.',teachHi:'गुणा बराबर समूहों का तेज़ तरीका है। 24 × 6 के लिए 24 को 20 और 4 में बाँटें: 120 + 24 = 144।',example:'24 × 6 = (20 × 6) + (4 × 6) = 144',qs:[['36 × 4 = ?','124','144','164','134',1,'30 × 4 = 120 and 6 × 4 = 24; total 144.'],['125 × 3 = ?','275','325','375','350',2,'100×3 + 20×3 + 5×3 = 300+60+15 = 375.']]},
{title:'Fractions in real life',hi:'दैनिक जीवन में भिन्न',teach:'A fraction names equal parts of a whole. In 3/4, the bottom number 4 tells the total equal parts; the top number 3 tells how many parts we have.',teachHi:'भिन्न किसी पूरी वस्तु के बराबर भाग बताता है। 3/4 में 4 कुल बराबर भाग और 3 लिए गए भाग बताते हैं।',example:'If a pizza has 8 equal slices and you eat 3, you ate 3/8.',qs:[['Which fraction is one-half?','2/1','1/3','2/4','3/2',2,'2/4 simplifies to 1/2: two of four equal parts.'],['A shape has 5 equal parts; 2 are shaded. What fraction is shaded?','5/2','2/5','3/5','2/3',1,'Two shaded parts out of five equal parts is 2/5.']]}]},
{id:'english',en:'English',hi:'अंग्रेज़ी',icon:'📖',desc:'Words, stories & grammar',lessons:[{title:'Nouns and describing words',hi:'संज्ञा और विशेषण',teach:'A noun names a person, place, animal or thing. An adjective describes a noun: a bright star, a gentle dog, a tall tree.',teachHi:'Noun किसी व्यक्ति, स्थान, जानवर या वस्तु का नाम है। Adjective संज्ञा की विशेषता बताता है: bright star, gentle dog, tall tree.',example:'In “The tiny bird sings,” bird is the noun and tiny is the adjective.',qs:[['Which word is an adjective in “The clever fox ran”?','fox','ran','clever','the',2,'Clever describes the fox, so it is an adjective.'],['Choose the correct plural of “child”.','childs','children','childes','childrens',1,'The plural of child is children.']]}]},
{id:'hindi',en:'Hindi',hi:'हिंदी',icon:'🪷',desc:'पढ़ें, समझें, लिखें',lessons:[{title:'संज्ञा और विशेषण',hi:'संज्ञा और विशेषण',teach:'किसी व्यक्ति, स्थान, वस्तु या भाव के नाम को संज्ञा कहते हैं। संज्ञा की विशेषता बताने वाले शब्द विशेषण कहलाते हैं।',teachHi:'किसी व्यक्ति, स्थान, वस्तु या भाव के नाम को संज्ञा कहते हैं। संज्ञा की विशेषता बताने वाले शब्द विशेषण कहलाते हैं।',example:'“सुंदर फूल” में फूल संज्ञा है और सुंदर विशेषण है।',qs:[['“मीठा आम” में विशेषण कौन-सा है?','आम','मीठा','में','कोई नहीं',1,'मीठा शब्द आम की विशेषता बता रहा है।'],['व्यक्ति के नाम को क्या कहते हैं?','क्रिया','विशेषण','संज्ञा','सर्वनाम',2,'व्यक्ति, स्थान और वस्तु के नाम संज्ञा होते हैं।']]}]},
{id:'evs',en:'EVS & Science',hi:'पर्यावरण व विज्ञान',icon:'🌱',desc:'Explore the world around you',lessons:[{title:'Plants are living things',hi:'पौधे सजीव हैं',teach:'Plants need sunlight, water, air and nutrients to grow. Roots usually absorb water and hold the plant in the soil. Leaves help plants make food using sunlight.',teachHi:'पौधों को बढ़ने के लिए धूप, पानी, हवा और पोषक तत्व चाहिए। जड़ें पानी सोखती हैं और पौधे को मिट्टी में पकड़ती हैं। पत्तियाँ धूप की मदद से भोजन बनाती हैं।',example:'Root → takes in water | Leaf → helps make food | Stem → supports the plant',qs:[['Which part usually absorbs water from soil?','Flower','Leaf','Root','Fruit',2,'Roots absorb water and minerals from the soil.'],['What do plants use to help make food?','Moonlight','Sunlight','Plastic','Sand only',1,'Leaves use sunlight in the process of photosynthesis.']]}]},
{id:'gk',en:'General Knowledge',hi:'सामान्य ज्ञान',icon:'🌍',desc:'Curiosity about everything',lessons:[{title:'India around us',hi:'हमारा भारत',teach:'India is a country in South Asia. New Delhi is its capital. The national flag has saffron, white and green bands, with a navy-blue Ashoka Chakra in the centre.',teachHi:'भारत दक्षिण एशिया का एक देश है। नई दिल्ली इसकी राजधानी है। राष्ट्रीय ध्वज में केसरिया, सफेद और हरे रंग की पट्टियाँ तथा बीच में नीला अशोक चक्र है।',example:'Capital: New Delhi | National animal: Bengal tiger',qs:[['What is the capital of India?','Mumbai','Kolkata','New Delhi','Chennai',2,'New Delhi is the capital of India.'],['How many colours are in the main bands of the Indian flag?','Two','Three','Four','Five',1,'The three bands are saffron, white and green.']]}]}
];
let state={lang:'en',tab:'home',subject:'math',lesson:0,q:0,selected:null,checked:false,score:0,answered:0,streak:0,done:[],today:0,history:[]};
try{const saved=JSON.parse(localStorage.getItem('brightsteps-state-v1')||'{}');state={...state,...saved,tab:'home',selected:null,checked:false}}catch(e){}
const screen=document.getElementById('screen');const hi=()=>state.lang==='hi';const tr=(en,h)=>hi()?h:en;
function save(){try{localStorage.setItem('brightsteps-state-v1',JSON.stringify({...state,selected:null,checked:false}))}catch(e){}}
function goal(){document.getElementById('goalCount').textContent=`${state.today} / 5 ${tr('questions','प्रश्न')}`;document.getElementById('goalBar').style.width=Math.min(100,state.today/5*100)+'%';document.getElementById('goalLabel').textContent=tr("Today's learning goal",'आज का सीखने का लक्ष्य');document.getElementById('greeting').textContent=tr('Ready to shine, Rajat? 🌟','राजत, चमकने के लिए तैयार? 🌟');document.getElementById('subline').textContent=tr('Little steps today. Big discoveries tomorrow.','आज छोटे कदम, कल बड़ी खोजें।');document.getElementById('langBtn').textContent=hi()?'English':'हिन्दी'}
function subjectCard(s){const done=state.done.filter(x=>x.startsWith(s.id+':')).length;const total=s.lessons.reduce((a,l)=>a+l.qs.length,0);return `<button class="subject" data-subject="${s.id}"><span class="emoji">${s.icon}</span><b>${tr(s.en,s.hi)}</b><small>${tr(s.desc,({math:'सोचें, हल करें, खोजें',english:'शब्द, कहानियाँ और व्याकरण',hindi:'पढ़ें, समझें, लिखें',evs:'आस-पास की दुनिया जानें',gk:'हर विषय के बारे में जानें'})[s.id]||s.desc)}</small><div class="mini"><span style="width:${Math.min(100,done/total*100)}%"></span></div></button>`}
function home(){screen.innerHTML=`<div class="stats"><div class="stat"><strong>${state.score}</strong><span>⭐ ${tr('Stars earned','सितारे')}</span></div><div class="stat"><strong>${state.answered}</strong><span>✓ ${tr('Answered','उत्तर दिए')}</span></div><div class="stat"><strong>${state.answered?Math.round(state.score/state.answered*100):0}%</strong><span>🎯 ${tr('Accuracy','सटीकता')}</span></div></div><div class="sectionhead"><h2>${tr('Choose your adventure','अपनी पढ़ाई चुनें')}</h2><span class="muted">CBSE · Class 3</span></div><div class="subjects">${subjects.map(subjectCard).join('')}</div><div class="panel" style="margin-top:17px"><div class="sectionhead"><h2>${tr('Your learning plan','आपकी सीखने की योजना')}</h2>🌈</div><p class="explain">${tr('First learn a concept, see an example, then practise questions. Your progress is saved on this device.','पहले अवधारणा सीखें, उदाहरण देखें, फिर प्रश्न हल करें। आपकी प्रगति इसी डिवाइस पर सेव होगी।')}</p><button class="btn full" data-tab="learn">${tr('Start learning →','सीखना शुरू करें →')}</button></div>`}
function learn(){const s=subjects.find(x=>x.id===state.subject)||subjects[0];const l=s.lessons[state.lesson%s.lessons.length];screen.innerHTML=`<div class="sectionhead"><button class="btn ghost" data-tab="home">← ${tr('Subjects','विषय')}</button><span class="tag">${s.icon} ${tr(s.en,s.hi)}</span></div><div class="panel"><span class="smalltitle">${tr('STEP 1 · LEARN','चरण 1 · सीखें')}</span><div class="lesson-title">${hi()?(l.title===l.hi?l.hi:l.hi):l.title}</div><p class="explain">${hi()?l.teachHi:l.teach}</p><div class="example"><b>💡 ${tr('Example','उदाहरण')}</b><br>${l.example}</div><div class="row"><button class="btn secondary" data-action="prevLesson">← ${tr('Previous','पिछला')}</button><button class="btn secondary" data-action="nextLesson">${tr('Next lesson','अगला पाठ')} →</button></div></div><div class="panel"><span class="smalltitle">${tr('STEP 2 · PRACTISE','चरण 2 · अभ्यास')}</span><h3>${tr('Ready to check what you learned?','जो सीखा उसे जाँचें?')}</h3><p class="muted">${l.qs.length} ${tr('short questions with explanations','छोटे प्रश्न और उनके स्पष्टीकरण')}</p><button class="btn full" data-action="startQuiz">${tr('Practise this lesson →','इस पाठ का अभ्यास करें →')}</button></div>`}
function currentQ(){const s=subjects.find(x=>x.id===state.subject)||subjects[0];const l=s.lessons[state.lesson%s.lessons.length];return {s,l,q:l.qs[state.q%l.qs.length]}}
function quiz(){const {s,l,q}=currentQ();screen.innerHTML=`<div class="sectionhead"><button class="btn ghost" data-tab="learn">← ${tr('Lesson','पाठ')}</button><span class="tag">${tr('QUESTION','प्रश्न')} ${state.q+1}/${l.qs.length}</span></div><div class="panel"><span class="smalltitle">${tr('STEP 2 · PRACTISE','चरण 2 · अभ्यास')}</span><div class="lesson-title">${hi()&&s.id==='hindi'?q[0]:q[0]}</div><div class="options">${q.slice(1,5).map((o,i)=>`<button class="option ${state.selected===i?'selected':''} ${state.checked&&i===q[5]?'correct':''} ${state.checked&&state.selected===i&&i!==q[5]?'wrong':''}" data-option="${i}" ${state.checked?'disabled':''}>${String.fromCharCode(65+i)}. ${o}</button>`).join('')}</div>${state.checked?`<div class="feedback ${state.selected===q[5]?'good':'bad'}"><b>${state.selected===q[5]?tr('Correct! 🌟','सही जवाब! 🌟'):tr('Not quite — keep going!','लगभग — कोशिश जारी रखें!')}</b><br>${q[6]}</div><button class="btn full" data-action="nextQ">${state.q+1<l.qs.length?tr('Next question →','अगला प्रश्न →'):tr('Finish practice ✓','अभ्यास पूरा करें ✓')}</button>`:`<button class="btn full" data-action="check" ${state.selected===null?'disabled':''}>${tr('Check answer','उत्तर जाँचें')}</button>`}</div>`}
function practice(){screen.innerHTML=`<div class="sectionhead"><h2>${tr('Practice zone','अभ्यास क्षेत्र')}</h2><span class="tag">✏️ ${tr('Learn then practise','सीखें फिर अभ्यास')}</span></div><p class="explain">${tr('Choose a subject. Each set starts with a short lesson and gives feedback for every answer.','विषय चुनें। हर अभ्यास से पहले छोटा पाठ और हर उत्तर पर स्पष्टीकरण मिलेगा।')}</p><div class="subjects">${subjects.map(s=>`<button class="subject" data-practice="${s.id}"><span class="emoji">${s.icon}</span><b>${tr(s.en,s.hi)}</b><small>${s.lessons.reduce((n,l)=>n+l.qs.length,0)} ${tr('questions','प्रश्न')}</small></button>`).join('')}</div>`}
function progress(){const total=subjects.reduce((n,s)=>n+s.lessons.reduce((a,l)=>a+l.qs.length,0),0);screen.innerHTML=`<div class="sectionhead"><h2>${tr('Your progress','आपकी प्रगति')}</h2><span class="tag">🏆 ${tr('Keep growing','आगे बढ़ते रहें')}</span></div><div class="stats"><div class="stat"><strong>${state.score}</strong><span>⭐ ${tr('Correct answers','सही उत्तर')}</span></div><div class="stat"><strong>${state.answered}</strong><span>📝 ${tr('Total attempts','कुल प्रयास')}</span></div><div class="stat"><strong>${state.done.length}</strong><span>📚 ${tr('Skills practised','अभ्यास किए पाठ')}</span></div></div><div class="panel"><h3>${tr('Subject progress','विषय के अनुसार प्रगति')}</h3>${subjects.map(s=>{let totalQ=s.lessons.reduce((n,l)=>n+l.qs.length,0),d=state.done.filter(x=>x.startsWith(s.id+':')).length;return `<p style="margin:14px 0 4px"><b>${s.icon} ${tr(s.en,s.hi)}</b><span style="float:right" class="muted">${d}/${totalQ}</span></p><div class="barline"><span style="width:${Math.min(100,d/totalQ*100)}%"></span></div>`}).join('')}</div><div class="panel"><h3>${tr('A note for Rajat','राजत के लिए')}</h3><p class="explain">${tr('Mistakes are part of learning. Read the explanation, try again, and celebrate every improvement.','गलतियाँ सीखने का हिस्सा हैं। स्पष्टीकरण पढ़ें, फिर कोशिश करें और हर सुधार का जश्न मनाएँ।')}</p><button class="btn secondary" data-action="reset">${tr('Reset progress on this device','इस डिवाइस की प्रगति रीसेट करें')}</button></div>`}
function render(){goal();document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===state.tab));if(state.tab==='home')home();else if(state.tab==='learn')learn();else if(state.tab==='practice')practice();else if(state.tab==='quiz')quiz();else progress();save()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.tab){state.tab=b.dataset.tab;render();return}if(b.dataset.subject||b.dataset.practice){state.subject=b.dataset.subject||b.dataset.practice;state.lesson=0;state.q=0;state.selected=null;state.checked=false;state.tab=b.dataset.practice?'learn':'learn';render();return}if(b.dataset.option!==undefined&&!state.checked){state.selected=Number(b.dataset.option);render();return}const a=b.dataset.action;if(a==='nextLesson'||a==='prevLesson'){const s=subjects.find(x=>x.id===state.subject);state.lesson=(state.lesson+(a==='nextLesson'?1:s.lessons.length-1))%s.lessons.length;render()}else if(a==='startQuiz'){state.q=0;state.selected=null;state.checked=false;state.tab='quiz';render()}else if(a==='check'&&state.selected!==null){state.checked=true;const {s,l,q}=currentQ();state.answered++;state.today++;if(state.selected===q[5])state.score++;const key=s.id+':'+state.lesson+':'+state.q;if(!state.done.includes(key))state.done.push(key);render()}else if(a==='nextQ'){const {l}=currentQ();if(state.q+1<l.qs.length){state.q++;state.selected=null;state.checked=false;render()}else{state.tab='progress';render()}}else if(a==='reset'){if(confirm(tr('Reset all saved progress on this device?','इस डिवाइस पर सेव की गई पूरी प्रगति रीसेट करें?'))){state.score=0;state.answered=0;state.done=[];state.today=0;render()}}});
document.getElementById('langBtn').addEventListener('click',()=>{state.lang=hi()?'en':'hi';render()});
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('/service-worker.js').catch(()=>{}));
render();
</script></body></html>
