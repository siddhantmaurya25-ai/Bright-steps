<style>

:.75rem;font-weight:800}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.subject{border:1px solid var(--line);background:#fff;text-align:left;border-radius:16px;padding:13px;min-height:112px;color:var(--ink)}.subject b{display:block;margin:4px 0}.subject small{color:var(--muted);font-size:.78rem}.ico{font-size:1.5rem}.btn{border:0;border-radius:12px;background:var(--blue);color:#fff;padding:11px 14px;font-weight:800}.btn.secondary{background:#eaf0fb;color:var(--blue)}.btn.dark{background:var(--navy)}.btn.ghost{background:#f1f4f8;color:var(--ink)}.btn:disabled{opacity:.45;cursor:default}.full{width:100%}.progress{height:8px;background:#e9eef5;border-radius:99px;overflow:hidden;margin-top:8px}.progress span{display:block;height:100%;background:linear-gradient(90deg,#2458a6,#ffb34f);width:0}.unit{width:100%;text-align:left;border:1px solid var(--line);border-radius:14px;background:white;padding:13px;margin:6px 0;color:var(--ink)}.unit b{display:block}.lesson{font-size:1.04rem;line-height:1.7}.example{background:#fff5e5;border-left:4px solid var(--orange);border-radius:10px;padding:12px;margin:14px 0}.options{display:grid;gap:9px;margin:15px 0}.option{border:1px solid var(--line);border-radius:13px;background:#fff;text-align:left;padding:13px;color:var(--ink)}.option.chosen{border:2px solid var(--blue);background:#edf4ff}.option.correct{border-color:var(--green);background:#e7f7ee}.option.wrong{border-color:var(--red);background:#fff0f0}.feedback{padding:12px;border-radius:12px;margin:12px 0;background:#f0f4fa}.feedback.good{background:#e8f7ef;color:#135c3a}.feedback.bad{background:#fff0f0;color:#8c2930}.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}.stat strong{display:block;font-size:1.25rem}.stat span{font-size:.76rem;color:var(--muted)}.day{border:1px solid var(--line);border-radius:14px;margin:9px 0;overflow:hidden;background:#fff}.dayhead{padding:12px;background:#edf3ff;display:flex;justify-content:space-between;gap:8px}.daybody{padding:12px}.checkrow{display:flex;gap:10px;align-items:flex-start;padding:8px 0}.checkrow input{margin-top:5px;transform:scale(1.15)}.tagline{font-size:.8rem;color:var(--muted)}.empty{padding:26px;text-align:center;color:var(--muted)}.notice{font-size:.82rem;background:#fff8e8;border:1px solid #ffe0a8;padding:12px;border-radius:12px}.tiny{font-size:.78rem;color:var(--muted)}@media(min-width:680px){.main{padding:22px}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.top{padding:24px 26px}.top-controls{margin-top:18px}}
</style></head><body><div class="app"><header class="top"><div class="topline"><div><div class="brand">Bright<span>Steps</span></div><div class="subline">Learn deeply. Practise smart. Grow daily.</div></div><span class="pill" style="background:#ffffff20;color:white">OFFLINE READY</span></div><div class="top-controls"><select id="grade" aria-label="Choose class"><option value="3">Class 3</option><option value="4">Class 4</option><option value="5">Class 5</option></select><select id="learner" aria-label="Choose learner"></select><button class="btn secondary" id="langBtn">हिन्दी</button></div></header><main class="main" id="screen"></main></div><nav class="nav"><button data-tab="home" class="active"><span class="ni">🏠</span>Home</button><button data-tab="learn"><span class="ni">📚</span>Learn</button><button data-tab="plan"><span class="ni">🗓️</span>21-day plan</button><button data-tab="exam"><span class="ni">📝</span>Exam</button><button data-tab="progress"><span class="ni">📈</span>Progress</button></nav>
<script src="curriculum.js"></script><script>
const $=s=>document.querySelector(s);const DB=window.BRIGHTSTEPS_CURRICULUM;const subjects=[['math','🔢','Mathematics','गणित'],['english','📘','English','अंग्रेज़ी'],['hindi','🔤','Hindi','हिंदी'],['world','🌍','World Around Us / Science & Social Studies','हमारा परिवेश / विज्ञान व सामाजिक अध्ययन'],['gk','🧠','GK & Reasoning','सामान्य ज्ञान व तर्क'],['computer','💻','Computing & Digital Safety','कंप्यूटिंग व डिजिटल सुरक्षा'],['art','🎨','Art, Health & Life Skills','कला, स्वास्थ्य व जीवन कौशल']];
const defaults={learners:['Rajat','Learner 2','Learner 3'],active:'Rajat',grade:3,lang:'en',tab:'home',unit:null,answers:{},completed:{},days:{},scores:{},stats:{},attempts:0,correct:0,exam:null,examIndex:0,examAnswers:[],examDone:false};let state={...defaults};try{state={...defaults,...JSON.parse(localStorage.getItem('brightsteps-35-v1')||'{}')}}catch(e){}
function save(){try{localStorage.setItem('brightsteps-35-v1',JSON.stringify(state))}catch(e){}}function hi(){return state.lang==='hi'}function tr(a,b){return hi()?b:a}function gradeUnits(){return DB.filter(x=>x.grade===+state.grade)}function unitsFor(subject){return gradeUnits().filter(x=>x.subject===subject)}function allUnits(){return gradeUnits()}function current(){return DB.find(x=>x.id===state.unit)}function mastery(id){let a=state.answers[state.active]||{};let x=a[id];return x&&x.n?Math.max(0,Math.round(x.c/x.n*100-Math.min(20,x.w*4))):0}function title(u){return tr(u.title,u.titleHi)}function subname(s){let x=subjects.find(y=>y[0]===s);return x?tr(x[2],x[3]):s}function selectedLearner(){return state.active}function learnerStats(){state.stats??={};return state.stats[state.active]||(state.stats[state.active]={attempts:0,correct:0})}
function syncHeader(){ $('#grade').value=state.grade;$('#langBtn').textContent=hi()?'English':'हिन्दी';$('#learner').innerHTML=state.learners.map(n=>`<option ${n===state.active?'selected':''}>${esc(n)}</option>`).join('');document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===state.tab))}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function home(){let us=allUnits(),done=us.filter(u=>(state.completed[state.active]||{})[u.id]).length;$('#screen').innerHTML=`<section class="card hero"><span class="pill">CBSE • CLASS ${state.grade}</span><h1>${tr('Ready to level up, ','आगे बढ़ने के लिए तैयार, ')}${esc(state.active)}? 🌟</h1><p class="muted">${tr('Two focused hours a day: learn, practise, revise and test yourself. Your lessons and progress stay on this device.','रोज़ दो घंटे: सीखें, अभ्यास करें, दोहराएँ और खुद को जाँचें। पाठ और प्रगति इसी डिवाइस पर रहते हैं।')}</p><div class="statgrid"><div class="stat"><strong>${learnerStats().correct}</strong><span>${tr('Correct answers','सही उत्तर')}</span></div><div class="stat"><strong>${learnerStats().attempts}</strong><span>${tr('Questions tried','प्रश्न किए')}</span></div><div class="stat"><strong>${us.length}</strong><span>${tr('Learning units','सीखने की इकाइयाँ')}</span></div></div><div class="progress"><span style="width:${us.length?done/us.length*100:0}%"></span></div><p class="tiny">${done}/${us.length} ${tr('units completed in this class','इस कक्षा की इकाइयाँ पूरी')}</p><button class="btn full" data-action="today">${tr('Start today’s 120-minute plan →','आज की 120 मिनट की योजना शुरू करें →')}</button></section><h2>${tr('Choose a subject','विषय चुनें')}</h2><div class="grid">${subjects.map(s=>`<button class="subject" data-subject="${s[0]}"><span class="ico">${s[1]}</span><b>${tr(s[2],s[3])}</b><small>${unitsFor(s[0]).length} ${tr('learning units','सीखने की इकाइयाँ')}</small></button>`).join('')}</div><section class="card"><h3>${tr('How BrightSteps teaches','BrightSteps कैसे सिखाता है')}</h3><p class="muted">${tr('Understand → see an example → answer a question → read why → revisit weak skills. The 21-day plan includes review and mock exams.','समझें → उदाहरण देखें → प्रश्न हल करें → कारण पढ़ें → कमजोर कौशल दोहराएँ। 21-दिन की योजना में पुनरावृत्ति और अभ्यास-परीक्षाएँ हैं।')}</p></section>`}
function learn(){let sub=state.filterSubject||'math';let arr=unitsFor(sub);$('#screen').innerHTML=`<div class="row"><div><h1>${tr('Learning library','सीखने की लाइब्रेरी')}</h1><p class="muted">${tr('Class','कक्षा')} ${state.grade} · ${tr('Teach first, practise second','पहले सीखें, फिर अभ्यास करें')}</p></div><select id="subjectPick">${subjects.map(s=>`<option value="${s[0]}" ${sub===s[0]?'selected':''}>${tr(s[2],s[3])}</option>`).join('')}</select></div>${arr.map((u,i)=>`<button class="unit" data-unit="${u.id}"><div class="row"><b>${i+1}. ${title(u)}</b><span class="pill">${mastery(u.id)}%</span></div><div class="tagline">${tr('Lesson + worked example + exam-style question','पाठ + हल किया उदाहरण + परीक्षा-शैली प्रश्न')}</div><div class="progress"><span style="width:${mastery(u.id)}%"></span></div></button>`).join('')}<section class="card"><p class="tiny">${tr('Curriculum coverage is an expanding original study library aligned to broad grade-level skills; compare it with your school’s current chapter list for exact exam coverage.','यह मूल अध्ययन सामग्री कक्षा-स्तरीय कौशलों के अनुरूप विकसित की जा रही लाइब्रेरी है; परीक्षा की पूरी सटीकता के लिए इसे अपने स्कूल की वर्तमान अध्याय-सूची से मिलाएँ।')}</p></section>`;$('#subjectPick').onchange=e=>{state.filterSubject=e.target.value;render()}}
function teach(u){$('#screen').innerHTML=`<button class="btn ghost" data-action="backlearn">← ${tr('Learning library','सीखने की लाइब्रेरी')}</button><section class="card"><span class="pill">${u.icon} ${subname(u.subject)} · CLASS ${u.grade}</span><h1 style="margin-top:12px">${title(u)}</h1><p class="lesson">${tr(u.teach,u.teachHi)}</p><div class="example"><b>💡 ${tr('Worked example','हल किया हुआ उदाहरण')}</b><p style="margin:7px 0 0">${tr(u.example,u.exampleHi)}</p></div><p class="muted">${tr('Read it aloud, explain it in your own words, then try the question without looking at the example.','इसे ज़ोर से पढ़ें, अपने शब्दों में समझाएँ, फिर उदाहरण देखे बिना प्रश्न हल करें।')}</p><button class="btn full" data-action="practiceUnit">${tr('I understand — practise now →','समझ गया — अब अभ्यास करें →')}</button></section>`}
function practiceUnit(){let u=current();if(!u)return learn();let ans=state.currentAnswer;$('#screen').innerHTML=`<button class="btn ghost" data-action="backteach">← ${tr('Lesson','पाठ')}</button><section class="card"><span class="pill">${tr('EXAM PRACTICE','परीक्षा अभ्यास')} · ${u.grade}</span><h2 style="margin-top:12px">${title(u)}</h2><h3>${tr(u.question, u.question)}</h3><div class="options">${u.options.map((o,i)=>`<button class="option ${state.checkedUnit&&i===u.answer?'correct':''} ${state.checkedUnit&&ans===i&&i!==u.answer?'wrong':''} ${!state.checkedUnit&&ans===i?'chosen':''}" data-opt="${i}" ${state.checkedUnit?'disabled':''}>${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join('')}</div>${state.checkedUnit?`<div class="feedback ${ans===u.answer?'good':'bad'}"><b>${ans===u.answer?tr('Correct!','सही उत्तर!'):tr('Review the idea','विचार दोहराएँ')}</b><br>${tr(u.explain,u.explainHi)}</div><button class="btn full" data-action="finishUnit">${tr('Mark lesson complete & continue','पाठ पूरा करें और आगे बढ़ें')}</button>`:`<button class="btn full" data-action="checkUnit" ${ans===undefined?'disabled':''}>${tr('Check answer','उत्तर जाँचें')}</button>`}</section>`}
function plan(){let days=[];for(let d=1;d<=21;d++){let us=allUnits();let chosen=[];for(let j=0;j<4;j++){let idx=((d-1)*4+j)%us.length;chosen.push(us[idx])}let kind=d%7===0?'Weekly review & test':d===21?'Final cumulative assessment':d%6===0?'Mixed practice and correction':'New learning + spaced review';days.push({d,chosen,kind})}let done=state.days[state.active]||{};$('#screen').innerHTML=`<h1>${tr('Your 21-day study plan','आपकी 21-दिन की अध्ययन योजना')}</h1><p class="muted">${tr('120 minutes each day · all subjects · offline. Check off activities as you complete them.','हर दिन 120 मिनट · सभी विषय · ऑफलाइन। गतिविधियाँ पूरी होने पर चेक करें।')}</p><section class="card"><h3>${tr('Daily time budget','दैनिक समय-विभाजन')}</h3>${[['Learn a new concept',35,'नई अवधारणा सीखें'],['Guided practice',30,'निर्देशित अभ्यास'],['Exam questions',25,'परीक्षा के प्रश्न'],['Revision + reading / break plan',20,'दोहराव + पठन / विराम योजना'],['Recall, reflection and error log',10,'याद करना, समीक्षा और गलती नोटबुक']].map(x=>`<div class="row"><span>${tr(x[0],x[2])}</span><b>${x[1]} min</b></div><div class="progress"><span style="width:${x[1]/120*100}%"></span></div>`).join('')}<p class="tiny">${tr('Take short movement and water breaks between blocks; 120 minutes is a total learning window, not 120 minutes of nonstop screen use.','खंडों के बीच थोड़ा चलें और पानी पिएँ; 120 मिनट कुल अध्ययन समय है, लगातार स्क्रीन देखने का समय नहीं।')}</p></section>${days.map(day=>`<article class="day"><div class="dayhead"><b>DAY ${day.d} · ${tr(day.kind,day.d===21?'अंतिम समेकित मूल्यांकन':day.d%7===0?'साप्ताहिक पुनरावृत्ति व परीक्षा':day.d%6===0?'मिश्रित अभ्यास और सुधार':'नया सीखना + अंतराल पर पुनरावृत्ति')}</b><span class="pill">${(done[day.d]||[]).length}/4</span></div><div class="daybody">${day.chosen.map((u,i)=>`<label class="checkrow"><input type="checkbox" data-day="${day.d}" data-task="${i}" ${(done[day.d]||[]).includes(i)?'checked':''}><span><b>${title(u)}</b><span class="tiny"> · ${subname(u.subject)} · ${[35,30,25,20][i]} min</span></span></label>`).join('')}<p class="tiny">${tr('Daily close: 10 min recall, explain one concept aloud, and write one mistake you corrected.','दिन का अंत: 10 मिनट याद करें, एक अवधारणा बोलकर समझाएँ और सुधारी गई एक गलती लिखें।')}</p></div></article>`).join('')}`;document.querySelectorAll('[data-day]').forEach(c=>c.onchange=()=>{let d=+c.dataset.day,i=+c.dataset.task;state.days[state.active]??={};state.days[state.active][d]??=[];let a=state.days[state.active][d];state.days[state.active][d]=c.checked?[...new Set([...a,i])]:a.filter(x=>x!==i);save();render()})}
function exam(){if(state.examDone){$('#screen').innerHTML=`<section class="card hero"><h1>${tr('Assessment complete','मूल्यांकन पूरा')}</h1><p>${tr('You scored','आपका स्कोर')} <b>${state.examScore}/${state.exam.length}</b>.</p><p>${tr('Review the answer explanations below, then practise the topics you missed. This is a practice assessment, not an official CBSE paper.','नीचे उत्तरों की व्याख्या पढ़ें और छूटे विषयों का अभ्यास करें। यह अभ्यास मूल्यांकन है, आधिकारिक CBSE प्रश्नपत्र नहीं।')}</p><button class="btn full" data-action="newExam">${tr('Take another mixed test','एक और मिश्रित परीक्षा दें')}</button></section>${state.exam.map((u,i)=>`<section class="card"><b>${i+1}. ${title(u)}</b><p>${tr(u.question,u.question)}</p><p class="${state.examAnswers[i]===u.answer?'':'feedback bad'}"><b>${state.examAnswers[i]===u.answer?tr('Correct','सही'):tr('Review','दोहराएँ')}:</b> ${esc(u.options[u.answer])}</p><p class="muted">${tr(u.explain,u.explainHi)}</p></section>`).join('')}`;return}if(!state.exam){let pool=allUnits().slice().sort(()=>Math.random()-.5).slice(0,Math.min(20,allUnits().length));state.exam=pool;state.examIndex=0;state.examAnswers=[]}let i=state.examIndex,u=state.exam[i];if(!u){state.examDone=true;state.examScore=state.examAnswers.filter((a,j)=>a===state.exam[j].answer).length;save();exam();return}$('#screen').innerHTML=`<section class="card"><div class="row"><span class="pill">${tr('MIXED MOCK TEST','मिश्रित अभ्यास परीक्षा')}</span><span>${i+1}/${state.exam.length}</span></div><div class="progress"><span style="width:${(i+1)/state.exam.length*100}%"></span></div><p class="muted">${subname(u.subject)} · ${title(u)}</p><h2>${tr(u.question,u.question)}</h2><div class="options">${u.options.map((o,j)=>`<button class="option ${state.examAnswers[i]===j?'chosen':''}" data-examopt="${j}">${String.fromCharCode(65+j)}. ${esc(o)}</button>`).join('')}</div><div class="row"><button class="btn ghost" data-action="examBack" ${i===0?'disabled':''}>${tr('Previous','पिछला')}</button><button class="btn" data-action="examNext">${i===state.exam.length-1?tr('Finish test','परीक्षा समाप्त'):tr('Next question →','अगला प्रश्न →')}</button></div></section><p class="tiny">${tr('Choose one answer per question. Your result and explanations appear after submission.','हर प्रश्न का एक उत्तर चुनें। जमा करने के बाद परिणाम और व्याख्याएँ दिखेंगी।')}</p>`}
function progress(){let us=allUnits(),complete=us.filter(u=>(state.completed[state.active]||{})[u.id]).length;let weak=us.map(u=>({u,m:mastery(u.id)})).sort((a,b)=>a.m-b.m).slice(0,6);$('#screen').innerHTML=`<h1>${tr('Progress & next steps','प्रगति और अगले कदम')}</h1><div class="statgrid"><div class="stat"><strong>${learnerStats().correct}</strong><span>${tr('Correct','सही')}</span></div><div class="stat"><strong>${learnerStats().attempts}</strong><span>${tr('Attempts','प्रयास')}</span></div><div class="stat"><strong>${complete}/${us.length}</strong><span>${tr('Units completed','पूरी इकाइयाँ')}</span></div></div><section class="card"><h2>${tr('Skills to revisit','दोहराने वाले कौशल')}</h2>${weak.map(x=>`<button class="unit" data-unit="${x.u.id}"><div class="row"><b>${title(x.u)}</b><span class="pill">${x.m}%</span></div><div class="tagline">${subname(x.u.subject)}</div></button>`).join('')}</section><section class="card"><h3>${tr('Manage learners','विद्यार्थी प्रबंधन')}</h3><p class="muted">${tr('Each learner has separate progress on this device. Add a profile for another child or class.','हर विद्यार्थी की प्रगति इस डिवाइस पर अलग रहती है। दूसरे बच्चे या कक्षा के लिए प्रोफ़ाइल जोड़ें।')}</p><div class="row"><input id="newLearner" placeholder="${tr('Learner name','विद्यार्थी का नाम')}" style="flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:11px"><button class="btn" data-action="addLearner">${tr('Add','जोड़ें')}</button></div><div class="row" style="margin-top:12px"><button class="btn secondary" data-action="export">${tr('Export progress','प्रगति निर्यात करें')}</button><button class="btn ghost" data-action="reset">${tr('Reset this learner','इस विद्यार्थी की प्रगति रीसेट')}</button></div></section><section class="card"><h3>${tr('About this learning library','इस अध्ययन लाइब्रेरी के बारे में')}</h3><p class="tiny">${tr('Content is original, bilingual, and designed for practice. Coverage is a strong starter curriculum map, not a claim that every school textbook chapter or every exam question is included. Match it against the current school syllabus and add approved resources as needed. Mastery is an estimate from practice answers, not a formal diagnosis.','सामग्री मौलिक, द्विभाषी और अभ्यास के लिए है। यह एक विस्तृत प्रारंभिक पाठ्यक्रम-मानचित्र है, हर स्कूल की किताब के हर अध्याय या हर परीक्षा प्रश्न के शामिल होने का दावा नहीं। वर्तमान स्कूल पाठ्यक्रम से मिलाएँ और ज़रूरत पर अनुमोदित सामग्री जोड़ें। दक्षता अभ्यास उत्तरों का अनुमान है, औपचारिक निदान नहीं।')}</p><div class="row"><a href="https://ncert.nic.in/textbook.php" target="_blank" rel="noopener">NCERT textbooks ↗</a><a href="https://cbseacademic.nic.in/safal/index.html" target="_blank" rel="noopener">CBSE SAFAL ↗</a></div></section>`}
function render(){syncHeader();save();if(state.tab==='home')home();else if(state.tab==='learn'){if(state.unit){let u=current();if(u){if(state.view==='practice')practiceUnit();else teach(u)}else learn()}else learn()}else if(state.tab==='plan')plan();else if(state.tab==='exam')exam();else progress()}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.tab){state.tab=b.dataset.tab;state.unit=null;state.view=null;render();return}if(b.dataset.subject){state.filterSubject=b.dataset.subject;state.tab='learn';state.unit=null;render();return}if(b.dataset.unit){state.unit=b.dataset.unit;state.view=null;state.tab='learn';state.checkedUnit=false;state.currentAnswer=undefined;render();return}if(b.dataset.opt!==undefined){state.currentAnswer=+b.dataset.opt;render();return}if(b.dataset.examopt!==undefined){state.examAnswers[state.examIndex]=+b.dataset.examopt;render();return}let a=b.dataset.action;if(a==='today'){state.tab='plan';render()}else if(a==='backlearn'){state.unit=null;state.view=null;render()}else if(a==='backteach'){state.view=null;state.checkedUnit=false;render()}else if(a==='practiceUnit'){state.view='practice';state.checkedUnit=false;state.currentAnswer=undefined;render()}else if(a==='checkUnit'){if(state.currentAnswer===undefined)return;let u=current(),ok=state.currentAnswer===u.answer;state.checkedUnit=true;learnerStats().attempts++;if(ok)learnerStats().correct++;let by=state.answers[state.active]||(state.answers[state.active]={});let x=by[u.id]||(by[u.id]={c:0,w:0,n:0});x.n++;if(ok)x.c++;else x.w++;save();render()}else if(a==='finishUnit'){let u=current();state.completed[state.active]??={};state.completed[state.active][u.id]=true;state.unit=null;state.view=null;state.checkedUnit=false;state.currentAnswer=undefined;state.tab='learn';render()}else if(a==='examNext'){if(state.examIndex<state.exam.length-1)state.examIndex++;else{state.examDone=true;state.examScore=state.examAnswers.filter((x,i)=>x===state.exam[i].answer).length}save();render()}else if(a==='examBack'){state.examIndex=Math.max(0,state.examIndex-1);render()}else if(a==='newExam'){state.exam=null;state.examIndex=0;state.examAnswers=[];state.examDone=false;state.examScore=0;render()}else if(a==='addLearner'){let inp=$('#newLearner'),n=inp.value.trim();if(n&&!state.learners.includes(n)){state.learners.push(n);state.active=n;state.grade=3}render()}else if(a==='export'){let blob=new Blob([JSON.stringify({app:'BrightSteps Classes 3–5',exportedAt:new Date().toISOString(),state},null,2)],{type:'application/json'});let url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='brightsteps-progress.json';link.click();URL.revokeObjectURL(url)}else if(a==='reset'&&confirm(tr('Reset this learner’s saved progress on this device?','इस डिवाइस पर इस विद्यार्थी की प्रगति रीसेट करें?'))){for(let k of ['answers','completed','days'])delete state[k][state.active];if(state.stats)delete state.stats[state.active];render()}});
$('#grade').onchange=e=>{state.grade=+e.target.value;state.unit=null;state.view=null;state.exam=null;state.examDone=false;render()};$('#learner').onchange=e=>{state.active=e.target.value;state.unit=null;state.view=null;render()};$('#langBtn').onclick=()=>{state.lang=hi()?'en':'hi';render()};render();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));}
</script></body></html>
